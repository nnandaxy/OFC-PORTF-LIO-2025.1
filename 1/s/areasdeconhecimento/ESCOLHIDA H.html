<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Escolhida</title>
    <link rel="stylesheet" href="ESCOLHIDA H.css">
</head>

<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle4 light"></div>
    <div class="dots">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="carousel-container">
        <div class="carousel-slide active">
            <div class="card">
                <h1>Ciências Humanas - Eixo 1 ⋆˙⟡</h1>
                <img src="ESCOLHIDAS IMG/9.png" alt="Imagem do Eixo 1 de Humanas">
            </div>
        </div>
        <div class="carousel-slide">
            <div class="card">
                <h1>Ciências Humanas - Eixo 2 ⋆˙⟡</h1>
                <img src="ESCOLHIDAS IMG/10.png" alt="Imagem do Eixo 2 de Humanas">
            </div>
        </div>
        <div class="carousel-slide">
            <div class="card">
                <h1>Ciências Humanas - Eixo 3 ⋆˙⟡</h1>
                <img src="ESCOLHIDAS IMG/11.png" alt="Imagem do Eixo 3 de Humanas">
            </div>
        </div>
        <div class="carousel-slide">
            <div class="card">
                <h1>Ciências Humanas - Eixo 4 ⋆˙⟡</h1>
                <img src="ESCOLHIDAS IMG/12.png" alt="Imagem do Eixo 4 de Humanas">
            </div>
        </div>

        <button class="carousel-btn prev-btn">‹</button>
        <button class="carousel-btn next-btn">›</button>
    </div>

    <script>
        const slides = document.querySelectorAll('.carousel-slide');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        let currentSlide = 0;

        function showSlide(index) {
            slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
        }

        prevBtn.addEventListener('click', () => {
            currentSlide = (currentSlide > 0) ? currentSlide - 1 : slides.length - 1;
            showSlide(currentSlide);
        });

        nextBtn.addEventListener('click', () => {
            currentSlide = (currentSlide < slides.length - 1) ? currentSlide + 1 : 0;
            showSlide(currentSlide);
        });

        showSlide(currentSlide);
    </script>
</body>

</html>
